[package]
name = "rustban"
version = "0.1.0"
edition = "2021"
description = "Lightweight Fail2Ban replacement in Rust that offloads ban expiration to Linux nftables timeout sets — zero database, zero timers, lockout-proof."
license = "MIT"
readme = "README.md"
repository = "https://github.com/marcelo-lipienski/rustban"
keywords = ["fail2ban", "nftables", "firewall", "security", "intrusion-prevention"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "rustban"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
humantime = "2.1"
ipnet = "2.10"
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
toml = "1.2"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
