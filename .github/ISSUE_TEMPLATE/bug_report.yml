name: Bug report
description: Report a bug, unexpected ban/unban behavior, or crash
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal config (`rustban.toml`), sample log lines, or commands to reproduce the issue.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `rustban --version`, `nft --version`, `uname -a`, and distro/container details.
      placeholder: |
        - rustban: 0.1.0
        - nftables: v1.0.6
        - Kernel: Linux 6.x
        - Distro: Debian 12
    validations:
      required: true
